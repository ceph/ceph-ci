meta:
- desc: |
   the clients keep their umbrella packages: while one is connected,
   require_min_compat_client cannot be set to vampire without force, and its
   session then still blocks a migration; once it is gone a migration runs;
   umbrella clients are refused from the moment vampire is required, during
   the migration and after it. The bootstrap shell is an umbrella client too,
   so from that moment the cluster is driven through the mon's own image.
tasks:
- print: "**** an umbrella client writes, then stays connected"
- exec:
    client.1:
      - rados -p data put obj-before-the-migration /etc/hosts
      - nohup ceph -w > /tmp/old-watch.log 2>&1 & echo $! > /tmp/old-watch.pid
      - sleep 15
- cephadm.shell:
    mon.a:
      - ceph config set global enable_experimental_unrecoverable_data_corrupting_features poolmigration
      - sleep 20
      - if ceph osd pool migrate data 64 ; then echo migrated-without-the-requirement ; exit 1 ; fi
      - if ceph osd set-require-min-compat-client vampire ; then echo required-with-an-umbrella-client-connected ; exit 1 ; fi
      - ceph osd set-require-min-compat-client vampire --yes-i-really-mean-it
- print: "**** from here the umbrella shell is refused too: use the mon's image"
- exec:
    mon.a:
      - sudo $TESTDIR/cephadm shell --name mon.a -- ceph osd dump | grep -w require_pool_migration
      - sudo $TESTDIR/cephadm shell --name mon.a -- ceph health detail
      - if sudo $TESTDIR/cephadm shell --name mon.a -- ceph health detail | grep INCOMPATIBLE_CLIENTS ; then echo unexpected-health-check ; exit 1 ; fi
      - if sudo $TESTDIR/cephadm shell --name mon.a -- ceph osd set-require-min-compat-client umbrella ; then echo lowered-below-the-requirement ; exit 1 ; fi
      - if sudo $TESTDIR/cephadm shell --name mon.a -- ceph osd pool migrate data 64 ; then echo migrated-with-an-umbrella-client-connected ; exit 1 ; fi
- print: "**** the umbrella client leaves and cannot come back"
- exec:
    client.1:
      - kill $(cat /tmp/old-watch.pid)
      - sleep 10
      - "! timeout 120 rados -p data ls"
- print: "**** the migration"
- exec:
    mon.a:
      - sleep 20
      - sudo $TESTDIR/cephadm shell --name mon.a -- ceph osd pool migrate data 64
      - sudo $TESTDIR/cephadm shell --name mon.a -- ceph osd pool ls --show-all | grep migrate-1
      - sudo $TESTDIR/cephadm shell --name mon.a -- rados -p data ls | wc -l
- exec:
    client.1:
      - "! timeout 120 rados -p data ls"
- exec:
    mon.a:
      - sudo $TESTDIR/cephadm shell --name mon.a -- bash -c 'while ceph osd pool ls detail -f json | jq -e "map(select(.migration_src != null or .migration_target != null)) | length > 0" ; do sleep 15 ; done'
      - sudo $TESTDIR/cephadm shell --name mon.a -- ceph osd pool ls detail
      - sudo $TESTDIR/cephadm shell --name mon.a -- rados -p data ls | wc -l
      - sudo $TESTDIR/cephadm shell --name mon.a -- rados -p data stat obj-before-the-migration
- print: "**** after the migration: umbrella clients stay refused"
- exec:
    client.1:
      - "! timeout 120 rados -p data ls"
- ceph.healthy:
