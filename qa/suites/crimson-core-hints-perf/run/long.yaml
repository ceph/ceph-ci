# About 2 hours of measurements: 4 object sizes x 3 workloads x 3 modes
# (hints off, on, and on with the OSDs' automatic un-hinting), unlimited
# and then capped at half the slowest mode's unlimited IOPS, twice
# (alternating the mode order): 144 runs of 30 s (and 10 s of ramp).
# 256k is left out: with 2 client nodes, reads of 16k and more are capped
# by the clients' network links.
# Un-hinting: a core 95% busy or more for 5 s is withheld (the default,
# 98%, is rarely reached here: the busiest reactors ran at 87-98% at
# saturation).
# run/ holds alternatives: schedule one with --filter run/long (or
# run/quick).
overrides:
  crimson_core_hints_perf:
    sizes: [1k, 4k, 16k, 64k]
    modes: ['off', 'on', 'unhint']   # quoted: YAML reads off/on as booleans
    unhint_conf:
      crimson_osd_core_hint_withhold_busy: 0.95
    runtime: 30
    ramp: 10
    repeat: 2
    rate_fractions: [0.5]
