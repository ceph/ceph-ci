roles:
# Test is for smb shares backed by RGW buckets. one node cluster is OK
- - host.a
  - mon.a
  - mgr.x
  - osd.0
  - osd.1
  - client.0
# Reserve a host for acting as a samba client
- - host.b
  - cephadm.exclude
overrides:
  ceph:
    log-only-match:
      - CEPHADM_
tasks:
- smb.configure_samba_client_container:
    role: host.b
- cephadm:
    single_host_defaults: true

# deploy rgw and wait for it to be ready
- cephadm.shell:
    host.a:
      - ceph orch apply rgw rgwsmb --port 8800
- cephadm.wait_for_service:
    service: rgw.rgwsmb

# create rgw users: a plain user, a second plain user (for the read-only
# share), and a tenant-aware user
- exec:
    host.a:
      - dnf install -y python3-boto3 || apt install -y python3-boto3
      - /home/ubuntu/cephtest/cephadm shell radosgw-admin user create --uid s3user1 --display-name s3user1 > /tmp/s3user1.json
      - /home/ubuntu/cephtest/cephadm shell radosgw-admin user create --uid s3user2 --display-name s3user2 > /tmp/s3user2.json
      - /home/ubuntu/cephtest/cephadm shell radosgw-admin user create --tenant ops --uid tenantuser --display-name tenantuser > /tmp/tenantuser.json

# create buckets (owned by the above users) and put a seed object in each
- python:
    host.a: |
      import json
      import boto3

      buckets = [
          ('/tmp/s3user1.json', 's3bucket1'),
          ('/tmp/s3user2.json', 's3bucket2'),
          ('/tmp/tenantuser.json', 'tenantbucket'),
      ]
      for ufile, bname in buckets:
          with open(ufile, 'rt') as f:
              info = json.loads(f.read())
          s3 = boto3.resource(
              's3',
              aws_access_key_id=info['keys'][0]['access_key'],
              aws_secret_access_key=info['keys'][0]['secret_key'],
              endpoint_url='http://localhost:8800',
          )
          bucket = s3.Bucket(bname)
          bucket.create()
          bucket.put_object(Key='seed.txt', Body='hello from s3\n')

- cephadm.shell:
    host.a:
      # set up smb cluster and shares
      - cmd: ceph mgr module enable smb
      # TODO: replace sleep with poll of mgr state?
      - cmd: sleep 30
      - cmd: ceph smb apply -i -
        stdin: |
          # --- Begin Embedded YAML
          - resource_type: ceph.smb.cluster
            cluster_id: rgwusr1
            auth_mode: user
            user_group_settings:
              - {source_type: resource, ref: ug1}
            placement:
              count: 1
          - resource_type: ceph.smb.usersgroups
            users_groups_id: ug1
            values:
              users:
                - {name: user1, password: t3stP4ss1}
                - {name: user2, password: t3stP4ss2}
              groups: []
          # bucket owner is detected automatically
          - resource_type: ceph.smb.share
            cluster_id: rgwusr1
            share_id: s3share1
            rgw:
              bucket: s3bucket1
          # tenant-aware user id
          - resource_type: ceph.smb.share
            cluster_id: rgwusr1
            share_id: s3tenant
            rgw:
              bucket: tenantbucket
              user_id: 'ops$tenantuser'
          # explicit user id, read-only
          - resource_type: ceph.smb.share
            cluster_id: rgwusr1
            share_id: s3ro
            readonly: true
            rgw:
              bucket: s3bucket2
              user_id: s3user2
          # --- End Embedded YAML
# Wait for the smb service to start
- cephadm.wait_for_service:
    service: smb.rgwusr1
# Check if shares exist
- template.exec:
    host.b:
      - sleep 30
      - "{{ctx.samba_client_container_cmd|join(' ')}} smbclient -U user1%t3stP4ss1 //{{'host.a'|role_to_remote|attr('ip_address')}}/s3share1 -c ls"
      - "{{ctx.samba_client_container_cmd|join(' ')}} smbclient -U user1%t3stP4ss1 //{{'host.a'|role_to_remote|attr('ip_address')}}/s3tenant -c ls"
      - "{{ctx.samba_client_container_cmd|join(' ')}} smbclient -U user1%t3stP4ss1 //{{'host.a'|role_to_remote|attr('ip_address')}}/s3ro -c ls"

- smb.workunit:
    admin_node: host.a
    smb_nodes: [host.a]
    smb_shares:
      - s3share1
      - s3tenant
      - s3ro
    smb_users:
      - username: user1
        password: t3stP4ss1
      - username: user2
        password: t3stP4ss2
    params:
      rgw_share:
        cluster_id: rgwusr1
        shares:
          s3share1:
            bucket: s3bucket1
          s3tenant:
            bucket: tenantbucket
            tenant: ops
          s3ro:
            bucket: s3bucket2
            readonly: true
    timeout: 1h
    clients:
      client.0:
        - [rgw_share]

- cephadm.shell:
    host.a:
      - cmd: ceph smb apply -i -
        stdin: |
          # --- Begin Embedded YAML
          - resource_type: ceph.smb.cluster
            cluster_id: rgwusr1
            intent: removed
          - resource_type: ceph.smb.usersgroups
            users_groups_id: ug1
            intent: removed
          - resource_type: ceph.smb.share
            cluster_id: rgwusr1
            share_id: s3share1
            intent: removed
          - resource_type: ceph.smb.share
            cluster_id: rgwusr1
            share_id: s3tenant
            intent: removed
          - resource_type: ceph.smb.share
            cluster_id: rgwusr1
            share_id: s3ro
            intent: removed
          # --- End Embedded YAML
# Wait for the smb service to be removed
- cephadm.wait_for_service_not_present:
    service: smb.rgwusr1
