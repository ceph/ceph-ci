overrides:
  check-counter:
    dry_run: true
  ceph:
    log-ignorelist:
      - RECENT_CRASH
      # the tests suppress journal trimming (mds_log_max_segments) so that a
      # dirfrag commit cannot purge behind them
      - Behind on trimming
      - \(MDS_TRIM\)

tasks:
- cephfs_test_runner:
    fail_on_skip: false
    # the arms of this suite are independent and more than one is expected to
    # fail once a fix lands; stopping at the first would hide the rest
    failfast: false
    modules:
      - tasks.cephfs.test_old_inodes
