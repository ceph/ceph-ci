overrides:
  ceph:
    log-ignorelist:
      - slow request
      - MDS_TRASH_PARKED
      - has snapshots and will not be purged
      - MDS_CACHE_OVERSIZED
tasks:
  - cephfs_test_runner:
      fail_on_skip: false
      failfast: false
      modules:
        - tasks.cephfs.test_rmtree
        - tasks.cephfs.test_strays.TestStrays.test_reintegration_forwarded
        - tasks.cephfs.test_strays.TestStrays.test_migration_on_shutdown_target_forwards
